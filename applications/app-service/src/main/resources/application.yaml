server:
  port: 8087
spring:
  application:
    name: "solicitudes"
  devtools:
    add-properties: false
  liquibase:
    enabled: true
    driver-class-name: "com.mysql.cj.jdbc.Driver"
    change-log: "classpath:db/changelog/db.changelog-master.yaml"
    url: "jdbc:mysql://${adapters.r2dbc.host}:${adapters.r2dbc.port}/${adapters.r2dbc.database}?useUnicode=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
    user: "${adapters.r2dbc.username}"
    password: "${adapters.r2dbc.password}"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
springdoc:
  api-docs.path: "/v3/api-docs"
  swagger-ui.path: "/swagger-ui"
  swagger-ui.operationsSorter: "method"
  swagger-ui.tagsSorter: "alpha"
logging:
  file:
    name: "logs/iam-app.log"
  level:
    root: "INFO"
    com.crediya.iam: "INFO"
    io.r2dbc.mysql: "WARN"
    org.springframework.r2dbc: "INFO"
    org.springframework.web.reactive.function.client.ExchangeFunctions: "DEBUG"
    org.springframework.http.client.reactive: "DEBUG"
adapters:
  r2dbc:
    host: "127.0.0.1"
    port: 3308
    database: "crediya_solicitudes"
    username: "solicitudes"
    password: "solicitudes_secure_2025"
adapter:
  restconsumer:
    url: "http://localhost:8081"
    timeout: 5000

  sqs:
    region: "us-east-2"
    queueUrl: "https://sqs.us-east-2.amazonaws.com/889522049804/loan-notification-email-queue"
  sqsborrowing:
    region: "us-east-2"
    queueUrl: "https://sqs.us-east-2.amazonaws.com/889522049804/calculate-borrowing-capacity-queue"




security:
  secret: "QnE1T2lXbVRhV3RzR2VOUXlHaFZ2d2dyU2p2a1R2TnM="
  expiration-sec: 3600
  issuer: "autenticacion-service"
  issuer-uri: ""
resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"

entrypoint:
  sqs:
    region: "us-east-2"
    #endpoint: "http://localhost:4566"
    queueUrl: "https://sqs.us-east-2.amazonaws.com/889522049804/request-results-queue"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1
